<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256" role="img" aria-label="TAEL-Agent logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#ring)" stroke-width="14"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- T glyph: crossbar + stem -->
  <g fill="none" stroke="url(#glyph)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 150 H344"/>
    <path d="M256 150 V268"/>
  </g>

  <!-- router branches from core -->
  <g fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M256 290 L196 330"/>
    <path d="M256 290 L316 330"/>
  </g>

  <!-- nodes: task domains + core -->
  <g>
    <circle cx="150" cy="150" r="14" fill="#0a0f1e" stroke="#67e8f9" stroke-width="7"/>
    <circle cx="362" cy="150" r="14" fill="#0a0f1e" stroke="#818cf8" stroke-width="7"/>
    <circle cx="196" cy="332" r="11" fill="#0a0f1e" stroke="#22d3ee" stroke-width="6"/>
    <circle cx="316" cy="332" r="11" fill="#0a0f1e" stroke="#22d3ee" stroke-width="6"/>
    <circle cx="256" cy="288" r="22" fill="url(#ring)"/>
    <circle cx="256" cy="288" r="8" fill="#0a0f1e"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="425" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="46" font-weight="700" letter-spacing="10" fill="#e2e8f0">TAEL</text>
</svg>
